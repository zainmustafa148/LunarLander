<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="LunarLander AI Lab: PPO, reward hacking and potential-based reward shaping." />
    <title>LunarLander AI Lab</title>
    <script>
      // Set the theme before first paint to avoid a flash. Key must match src/context/themeStorage.js.
      (function () {
        var theme = null;
        try {
          var stored = localStorage.getItem('lunarlander-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
